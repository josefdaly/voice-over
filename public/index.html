<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
  }

  /* ── Landing ── */
  #landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    width: 100%;
    max-width: 340px;
  }
  #landing h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
  #landing p  { color: #94a3b8; font-size: 0.9rem; text-align: center; }

  .input-row {
    display: flex;
    width: 100%;
    gap: 0.5rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.6rem 0.9rem;
    background: #1e2333;
    border: 1px solid #2d3348;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 0.95rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: #6366f1; }

  button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }

  .btn-primary { background: #6366f1; color: #fff; }
  .btn-ghost   { background: #1e2333; color: #94a3b8; border: 1px solid #2d3348; }
  .btn-danger  { background: #ef4444; color: #fff; }
  .btn-icon    {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; padding: 0;
  }

  /* ── Room ── */
  #room { display: none; flex-direction: column; align-items: center; gap: 1.75rem; width: 100%; }

  .room-header {
    display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
  }
  .room-header h2 { font-size: 1.1rem; font-weight: 600; }
  .room-slug { color: #6366f1; font-size: 0.85rem; font-family: monospace; }

  /* peer grid */
  #peers {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.25rem;
    max-width: 480px;
  }

  .peer {
    display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
  }
  .peer-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: #1e2333;
    border: 2px solid #2d3348;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 600; color: #a5b4fc;
    transition: border-color 0.15s, box-shadow 0.15s;
    user-select: none;
  }
  .peer-avatar.speaking {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99,102,241,0.25);
  }
  .peer-avatar.muted { opacity: 0.45; }
  .peer-label { font-size: 0.72rem; color: #64748b; }

  /* controls */
  .controls { display: flex; align-items: center; gap: 0.75rem; }

  .copy-link {
    font-size: 0.8rem; color: #6366f1; background: none; border: none;
    cursor: pointer; padding: 0; text-decoration: underline; opacity: 0.8;
  }
  .copy-link:hover { opacity: 1; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
    display: inline-block; margin-right: 0.35rem;
  }
  .status-dot.connecting { background: #eab308; }
  .status-dot.error      { background: #ef4444; }

  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: #1e2333; border: 1px solid #2d3348; border-radius: 8px;
    padding: 0.55rem 1rem; font-size: 0.82rem; color: #94a3b8;
    opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Landing: no room in URL -->
<div id="landing">
  <h1>Voice Chat</h1>
  <p>Enter a room name to start or join a voice call.</p>
  <div class="input-row">
    <input type="text" id="slug-input" placeholder="room-name" maxlength="64" autocomplete="off" spellcheck="false">
    <button class="btn-primary" onclick="joinFromInput()">Join</button>
  </div>
</div>

<!-- Active room -->
<div id="room">
  <div class="room-header">
    <h2><span class="status-dot connecting" id="status-dot"></span><span id="room-status">Connecting…</span></h2>
    <span class="room-slug" id="room-slug-label"></span>
  </div>

  <div id="peers"></div>

  <div class="controls">
    <button class="btn-icon btn-ghost" id="mute-btn" onclick="toggleMute()" title="Mute / Unmute">🎙️</button>
    <button class="btn-icon btn-danger" onclick="leaveRoom()" title="Leave">📵</button>
  </div>

  <button class="copy-link" onclick="copyLink()">copy room link</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

// ── State ────────────────────────────────────────────────────────────────────
let ws = null;
let myId = null;
let slug = null;
let localStream = null;
let muted = false;
const peers = {}; // peerId -> { pc, audio, analyser, avatarEl }

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const match = location.pathname.match(/^\/room\/([^/]+)/);
  if (match) {
    const s = decodeURIComponent(match[1]);
    document.getElementById('slug-input').value = s;
    startRoom(s);
  }
});

document.getElementById('slug-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinFromInput();
});

function joinFromInput() {
  const val = document.getElementById('slug-input').value.trim().replace(/\s+/g, '-');
  if (!val) return;
  history.pushState({}, '', `/room/${encodeURIComponent(val)}`);
  startRoom(val);
}

// ── Room lifecycle ────────────────────────────────────────────────────────────
async function startRoom(roomSlug) {
  slug = roomSlug;

  document.getElementById('landing').style.display = 'none';
  document.getElementById('room').style.display = 'flex';
  document.getElementById('room-slug-label').textContent = `#${slug}`;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (err) {
    setStatus('Mic denied', 'error');
    return;
  }

  addPeerUI('me', 'You');

  connectSignaling();
}

function connectSignaling() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(slug)}`);

  ws.onopen = () => setStatus('Connected', 'ok');

  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);

    if (msg.type === 'welcome') {
      myId = msg.peerId;
      for (const peerId of msg.peers) {
        await initiatePeer(peerId);
      }
    }

    if (msg.type === 'peer-joined') {
      // They'll send us an offer; just wait
    }

    if (msg.type === 'signal') {
      const { from, data } = msg;
      if (data.type === 'offer')  await handleOffer(from, data);
      if (data.type === 'answer') await handleAnswer(from, data);
      if (data.candidate != null) await handleIce(from, data);
    }

    if (msg.type === 'peer-left') {
      removePeer(msg.peerId);
    }
  };

  ws.onclose = () => setStatus('Disconnected', 'error');
}

// ── WebRTC ────────────────────────────────────────────────────────────────────
function makePeerConnection(peerId) {
  const pc = new RTCPeerConnection(ICE);

  for (const track of localStream.getTracks()) pc.addTrack(track, localStream);

  pc.onicecandidate = ({ candidate }) => {
    if (candidate) signal(peerId, candidate.toJSON());
  };

  pc.ontrack = ({ streams }) => {
    const audio = new Audio();
    audio.autoplay = true;
    audio.srcObject = streams[0];

    // speaking indicator via Web Audio
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(streams[0]);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);

    function tick() {
      if (!peers[peerId]) return;
      analyser.getByteFrequencyData(buf);
      const vol = buf.reduce((a, b) => a + b, 0) / buf.length;
      const el = peers[peerId]?.avatarEl;
      if (el) el.classList.toggle('speaking', vol > 8);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    if (peers[peerId]) peers[peerId].audio = audio;
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      addPeerUI(peerId);
    }
    if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
      removePeer(peerId);
    }
  };

  peers[peerId] = { pc, audio: null, avatarEl: null };
  return pc;
}

async function initiatePeer(peerId) {
  const pc = makePeerConnection(peerId);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  signal(peerId, { type: 'offer', sdp: offer.sdp });
}

async function handleOffer(peerId, offer) {
  const pc = makePeerConnection(peerId);
  await pc.setRemoteDescription({ type: 'offer', sdp: offer.sdp });
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  signal(peerId, { type: 'answer', sdp: answer.sdp });
}

async function handleAnswer(peerId, answer) {
  await peers[peerId]?.pc.setRemoteDescription({ type: 'answer', sdp: answer.sdp });
}

async function handleIce(peerId, candidate) {
  try { await peers[peerId]?.pc.addIceCandidate(candidate); } catch {}
}

function removePeer(peerId) {
  if (!peers[peerId]) return;
  peers[peerId].pc.close();
  peers[peerId].audio?.remove();
  peers[peerId].avatarEl?.closest('.peer')?.remove();
  delete peers[peerId];
}

function signal(to, data) {
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'signal', to, data }));
  }
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function addPeerUI(peerId, label) {
  const container = document.getElementById('peers');
  if (container.querySelector(`[data-peer="${peerId}"]`)) return;

  const letter = (label || peerId).charAt(0).toUpperCase();
  const div = document.createElement('div');
  div.className = 'peer';
  div.dataset.peer = peerId;
  div.innerHTML = `
    <div class="peer-avatar" id="avatar-${peerId}">${letter}</div>
    <span class="peer-label">${label || 'peer'}</span>
  `;
  container.appendChild(div);

  if (peers[peerId]) {
    peers[peerId].avatarEl = div.querySelector(`#avatar-${peerId}`);
  }

  if (peerId === 'me') {
    watchLocalVolume(div.querySelector('#avatar-me'));
  }
}

function watchLocalVolume(el) {
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(localStream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  src.connect(analyser);
  const buf = new Uint8Array(analyser.frequencyBinCount);
  function tick() {
    analyser.getByteFrequencyData(buf);
    const vol = buf.reduce((a, b) => a + b, 0) / buf.length;
    el.classList.toggle('speaking', !muted && vol > 8);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function toggleMute() {
  muted = !muted;
  localStream.getAudioTracks().forEach(t => { t.enabled = !muted; });
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🎙️';
  document.querySelector('[data-peer="me"] .peer-avatar')?.classList.toggle('muted', muted);
}

function leaveRoom() {
  ws?.close();
  for (const id of Object.keys(peers)) removePeer(id);
  localStream?.getTracks().forEach(t => t.stop());
  localStream = null;
  document.getElementById('peers').innerHTML = '';
  document.getElementById('room').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
  history.pushState({}, '', '/');
}

function setStatus(text, state) {
  document.getElementById('room-status').textContent = text;
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot';
  if (state === 'error') dot.classList.add('error');
  if (state === 'connecting') dot.classList.add('connecting');
}

function copyLink() {
  navigator.clipboard.writeText(location.href).then(() => showToast('Link copied!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
